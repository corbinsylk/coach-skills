<!doctype html>
<html><head><meta charset="utf-8"><style>
{{fonts}}
@page { size: 900px 1200px; margin: 0; }
* { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
html, body { margin: 0; background: #fff; }
.pg { width: 900px; height: 1200px; position: relative; overflow: hidden; font-family: 'Jakarta', sans-serif; color: #121417; background: #fff;
  page-break-after: always; break-after: page; }
.pg:last-child { page-break-after: auto; break-after: auto; }
.ph { position: absolute; left: 0; top: 0; width: 900px; height: 1200px; object-fit: cover; }
.rph { top: -230px; height: 1430px; }
.nophoto { background: radial-gradient(ellipse at 30% 20%, #EAF5EC 0%, #F4F2EE 55%, #ECE9E2 100%); }
.frost { background: rgba(255,255,255,0.86); border: 1.5px solid rgba(255,255,255,0.9); border-radius: 34px;
  box-shadow: 0 20px 50px rgba(20,24,28,0.18), inset 0 1px 0 rgba(255,255,255,0.9); backdrop-filter: blur(26px) saturate(150%); }
.eb { font-size: 18px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #5B636B; }
.acc { color: #16A34A; }
/* cover */
.veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0.55) 30%, rgba(255,255,255,0) 50%); }
.brand { position: absolute; left: 60px; top: 56px; padding: 12px 22px; border-radius: 40px; font-size: 18px; font-weight: 800; letter-spacing: 0.12em; }
.brand .logo-img { height: 34px; display: block; } .brand .logo-word { text-transform: uppercase; }
.ctitle { position: absolute; left: 60px; top: 150px; right: 60px; }
.big { font-size: 86px; font-weight: 800; letter-spacing: -0.045em; line-height: 0.98; margin-top: 16px; }
.cstats { position: absolute; left: 40px; right: 40px; bottom: 40px; padding: 28px 34px; }
.row4 { display: flex; justify-content: space-between; }
.row4 .v { font-size: 48px; font-weight: 800; letter-spacing: -0.04em; } .row4 .l { font-size: 18px; color: #5B636B; font-weight: 600; margin-top: 2px; }
.rule { height: 1.5px; background: rgba(18,20,23,0.10); margin: 22px 0 16px; }
.foot { display: flex; justify-content: space-between; font-size: 18px; color: #5B636B; font-weight: 600; } .foot b { color: #121417; }
/* guide */
.guide { background: #F4F2EE; padding: 80px 64px; }
.gt { font-size: 52px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.05; margin: 16px 0 40px; }
.gslot { background: #fff; border-radius: 26px; padding: 22px 28px; margin-bottom: 18px; box-shadow: 0 10px 30px rgba(20,24,28,0.06); }
.grow { display: flex; justify-content: space-between; gap: 20px; padding: 12px 0; border-bottom: 1.5px solid rgba(18,20,23,0.07); font-size: 21px; font-weight: 600; }
.grow:last-child { border-bottom: 0; }
.gm { color: #5B636B; font-weight: 500; white-space: nowrap; font-size: 18px; } .gm b { color: #121417; }
.gfoot { position: absolute; left: 64px; right: 64px; bottom: 60px; font-size: 19px; color: #5B636B; } .gfoot b { color: #121417; }
/* recipe page */
.panel { position: absolute; left: 32px; right: 32px; bottom: 32px; top: 560px; padding: 32px 40px; border-radius: 36px; }
.sp { display: flex; justify-content: space-between; }
.rt { font-size: 50px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.04; margin-top: 12px; }
.tags { display: flex; gap: 10px; margin-top: 18px; }
.tags span { padding: 8px 16px; border-radius: 30px; background: rgba(18,20,23,0.06); font-size: 17px; font-weight: 700; }
.nums { display: flex; gap: 12px; margin-top: 22px; }
.nums > div { flex: 1; border-radius: 20px; padding: 14px 18px; background: rgba(255,255,255,0.75); border: 1.5px solid rgba(18,20,23,0.08); }
.nums > div.dk { background: #121417; color: #fff; border: 0; }
.nums .v { font-size: 34px; font-weight: 800; letter-spacing: -0.04em; } .nums .l { font-size: 15px; font-weight: 600; opacity: 0.65; }
.cols { display: flex; gap: 36px; margin-top: 26px; }
.ing { width: 340px; } .meth { flex: 1; }
.il { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1.5px solid rgba(18,20,23,0.08); font-size: 19px; font-weight: 500; }
.il b { white-space: nowrap; }
.st { display: flex; gap: 12px; padding: 9px 0; font-size: 19px; line-height: 1.35; font-weight: 500; }
.st .n { width: 30px; height: 30px; flex: none; border-radius: 15px; background: #16A34A; color: #fff; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.small .rt { font-size: 42px; } .small .il, .small .st { font-size: 16.5px; padding: 6px 0; } .small .cols { margin-top: 18px; } .small .nums { margin-top: 16px; }
.small .nums .v { font-size: 30px; }
</style></head><body>{{pages}}</body></html>
