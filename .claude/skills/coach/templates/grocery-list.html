<!doctype html>
<html><head><meta charset="utf-8"><style>
{{fonts}}
@page { size: 794px 1123px; margin: 0; }
* { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
html, body { margin: 0; background: #F4F2EE; }
.page { width: 794px; min-height: 1123px; padding: 48px 52px; font-family: 'Jakarta', sans-serif; color: #121417; background: #F4F2EE; }
header { display: flex; justify-content: space-between; align-items: center; }
.logo { background: #fff; border-radius: 16px; padding: 12px 18px; box-shadow: 0 6px 20px rgba(20,24,28,0.06); }
.logo-img { max-height: 32px; display: block; } .logo-word { font-size: 14px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
.who { text-align: right; } .who b { display: block; font-size: 15px; } .who span { font-size: 13px; color: #5B636B; }
.eb { font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #5B636B; }
.acc { color: var(--accent); }
h1 { font-size: 50px; font-family: var(--head); font-weight: var(--head-w); letter-spacing: var(--head-ls); margin: 28px 0 6px; line-height: 1; }
.sub { font-size: 15px; color: #5B636B; margin-bottom: 26px; }
.grid { column-count: 2; column-gap: 22px; }
.aisle { break-inside: avoid; background: #fff; border-radius: 22px; padding: 18px 20px; margin-bottom: 18px; box-shadow: 0 8px 24px rgba(20,24,28,0.05); }
.gi { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1.5px solid rgba(18,20,23,0.06); font-size: 14.5px; font-weight: 500; }
.gi:last-child { border-bottom: 0; }
.gi .nm { flex: 1; } .gi b { white-space: nowrap; font-weight: 700; }
.box { width: 16px; height: 16px; border-radius: 5px; border: 2px solid rgba(18,20,23,0.25); flex: none; }
footer { display: flex; justify-content: space-between; margin-top: 18px; padding-top: 14px; border-top: 1.5px solid rgba(18,20,23,0.08); font-size: 13px; font-weight: 700; }
footer span:first-child { text-transform: uppercase; letter-spacing: 0.06em; }
</style></head><body><div class="page">
<header><div class="logo">{{logo}}</div><div class="who"><b>{{name}}</b><span>Weekly shop · {{count}} items</span></div></header>
<h1>Your grocery list</h1><div class="sub">Everything for one week of your meal plan. Tick as you go.</div>
<div class="grid">{{items}}</div>
<footer><span>{{business}}</span><span>{{handle}}</span></footer>
</div></body></html>
