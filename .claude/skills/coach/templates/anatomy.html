<!doctype html>
<html><head><meta charset="utf-8"><style>
{{fonts}}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1080px; height: 1350px; background: {{bg}}; overflow: hidden; }
.stage { position: absolute; inset: 0; overflow: hidden; }
.fig { position: absolute; left: 50%; top: {{fig_top}}px; width: {{fig_w}}px; height: {{fig_h}}px; margin-left: calc({{fig_w}}px / -2); }
.fig > * { position: absolute; inset: 0; width: 100%; height: 100%; }
.lines { object-fit: contain; }
.fill { background: linear-gradient(160deg, {{light}} 0%, {{base}} 70%); -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat; }
.glow { background: {{base}}; filter: blur(18px); -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat; }
.tag { position: absolute; right: 48px; top: 56px; width: 300px; font-family: 'Jakarta', sans-serif; box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
.tag .h { background: {{base}}; color: #fff; font-size: 24px; font-weight: 800; letter-spacing: 0.12em; text-align: center; padding: 12px 14px; }
.tag .b { background: #fff; color: #121417; font-size: 18px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; text-align: center;
  padding: 14px 16px; line-height: 1.4; }
.tag .a { background: #fff; color: #6B7178; font-size: 14px; font-weight: 600; text-align: center; padding: 0 16px 14px; margin-top: -6px; }
</style></head><body><div class="stage">
<div class="fig">{{layers}}<img class="lines" src="{{lines}}"></div>
<div class="tag"><div class="h">{{heading}}</div><div class="b">{{names}}</div><div class="a" style="{{also_vis}}">{{also}}</div></div>
</div></body></html>
